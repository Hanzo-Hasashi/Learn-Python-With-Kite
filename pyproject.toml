[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "learn-python-with-kite"
version = "1.0.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn>=0.30,<1",
    "sqlalchemy>=2.0,<3",
    "psycopg[binary]>=3.2,<4",
    "httpx>=0.27,<1",
    "google-auth>=2.35,<3",
    "email-validator>=2.2,<3",
    "cryptography>=43,<46",
]

[tool.setuptools]
packages = ["backend"]

[tool.vercel]
entrypoint = "backend.app:app"

 var b=document.createElement("button");b.className=x[2]||"";b.setAttribute("data-r",x[1]);b.innerHTML="<span>"+x[0].replace("&","&amp;")+"</span>"+CH;pn.appendChild(b)});
function theme(){try{return JSON.parse(localStorage.getItem("kiteset")||"{}").theme||"system"}catch(e){return"system"}}
function route(){var r=(location.hash||"#launch").slice(1);return DOCS[r]?r:"launch"}
var routeHistoryKey="kite.routeHistory",routeHistory=[],routeSequence=0;
function saveRouteHistory(){try{sessionStorage.setItem(routeHistoryKey,JSON.stringify(routeHistory.slice(-100)))}catch(e){console.error("Could not save Kite navigation history.",e)}}
function initializeRouteHistory(){
 var current=route(),state=history.state;
 try{var saved=JSON.parse(sessionStorage.getItem(routeHistoryKey)||"[]");if(Array.isArray(saved))routeHistory=saved.filter(function(x){return x&&DOCS[x.route]&&Number.isInteger(x.seq)})}catch(e){routeHistory=[]}
 if(state&&state.kiteRoute===current&&Number.isInteger(state.kiteSequence)){
  routeSequence=state.kiteSequence;
  if(!routeHistory.some(function(x){return x.seq===routeSequence&&x.route===current}))routeHistory=[{route:current,seq:routeSequence}];
 }else{
  routeSequence=0;routeHistory=[{route:current,seq:routeSequence}];
  history.replaceState({kiteRoute:current,kiteSequence:routeSequence},"",location.href);
 }
 saveRouteHistory()
}
function navigateTo(r,replace){
 if(!DOCS[r]||r===route())return;
 var state=history.state,currentSequence=state&&state.kiteRoute===route()&&Number.isInteger(state.kiteSequence)?state.kiteSequence:routeSequence;
 routeSequence=replace?currentSequence:currentSequence+1;
 routeHistory=routeHistory.filter(function(x){return x.seq<(replace?currentSequence:currentSequence+1)});
 routeHistory.push({route:r,seq:routeSequence});
 if(replace)history.replaceState({kiteRoute:r,kiteSequence:routeSequence},"",location.pathname+location.search+"#"+r);
 else history.pushState({kiteRoute:r,kiteSequence:routeSequence},"",location.pathname+location.search+"#"+r);
 saveRouteHistory();cur=null;show()
}
window.kiteNavigate=navigateTo;
function syncNavigation(){
 var r=route(),state=history.state;
 if(state&&state.kiteRoute===r&&Number.isInteger(state.kiteSequence)){
  routeSequence=state.kiteSequence;
  if(!routeHistory.some(function(x){return x.seq===routeSequence&&x.route===r}))routeHistory.push({route:r,seq:routeSequence});
  saveRouteHistory();show();return
 }
 var currentState=history.state,currentRoute=currentState&&currentState.kiteRoute;
 var currentSequence=currentState&&Number.isInteger(currentState.kiteSequence)?currentState.kiteSequence:routeSequence;
 routeSequence=currentSequence+1;routeHistory=routeHistory.filter(function(x){return x.seq<=currentSequence});
 routeHistory.push({route:r,seq:routeSequence});
 history.replaceState({kiteRoute:r,kiteSequence:routeSequence},"",location.href);
 saveRouteHistory();show()
}
function goBack(){
 var state=history.state,seq=state&&state.kiteRoute===route()?state.kiteSequence:-1;
 if(seq>=0&&routeHistory.some(function(x){return x.seq===seq-1})){history.back();return}
 var fallback={home:"launch",learn:"home",lesson:"learn",challenge:"learn",quiz:"lesson",playground:"learn",
  leaderboard:"home",notifications:"home",profile:"home",preferences:"profile",progress:"home",about:"home"};
 navigateTo(fallback[route()]||"home")
}
window.kiteGoBack=goBack;
function show(){
 var r=route();if(r===cur)return;cur=r;closeMore();
 var t=theme(),root=document.documentElement;if(t==="system")root.removeAttribute("data-theme");else root.setAttribute("data-theme",t);
 f.style.opacity=0;
 setTimeout(function(){var h=DOCS[r];if(t!=="system")h=h.replace('<html lang="en">','<html lang="en" data-theme="'+t+'">');f.srcdoc=h},120)}
f.addEventListener("load",function(){f.style.opacity=1;try{f.contentWindow.focus()}catch(e){}});
window.addEventListener("hashchange",syncNavigation);
window.addEventListener("popstate",function(){syncNavigation()});
function openMore(){opener=document.activeElement;mo.classList.add("on");var b=pn.querySelector("button");if(b)b.focus()}
function closeMore(){if(!mo.classList.contains("on"))return;mo.classList.remove("on");try{f.contentWindow.focus()}catch(e){}}
mo.addEventListener("click",function(e){if(e.target===mo){closeMore();return}var b=e.target.closest("[data-r]");if(b){var r=b.getAttribute("data-r");closeMore();navigateTo(r)}});
document.addEventListener("keydown",function(e){if(e.key==="Escape")closeMore()});
window.addEventListener("message",function(e){
 if(e.source!==f.contentWindow||!e.data||!e.data.kite)return;var r=e.data.r;
 if(r==="back"){goBack();return}
 if(r==="more"){openMore();return}
 if(DOCS[r])navigateTo(r)});
initializeRouteHistory();
show();
})();
</script>

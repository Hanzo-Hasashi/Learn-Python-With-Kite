name: Production Health Checks

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: render-backend-health-check
  cancel-in-progress: false

jobs:
  health-check:
    name: Check ${{ matrix.service }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: Render backend liveness
            url: https://kite-backend-958r.onrender.com/health
          - service: Vercel frontend availability
            url: https://learnpythonwithkite.vercel.app/
    steps:
      - name: Request the production endpoint
        env:
          HEALTH_URL: ${{ matrix.url }}
        run: |
          set -u

          case "$HEALTH_URL" in
            https://*) ;;
            *)
              echo "::error::The production health-check URL must use HTTPS."
              exit 2
              ;;
          esac

          for attempt in 1 2 3 4; do
            if http_status=$(curl --silent --output /dev/null --write-out '%{http_code}' \
              --location --max-redirs 5 --connect-timeout 15 --max-time 90 "$HEALTH_URL"); then
              curl_status=0
            else
              curl_status=$?
              http_status="${http_status:-000}"
            fi

            if [ "$curl_status" -eq 0 ] && [ "$http_status" = "200" ]; then
              echo "Endpoint check succeeded (HTTP $http_status)."
              exit 0
            fi

            echo "Attempt $attempt failed (curl exit $curl_status, HTTP ${http_status:-000})."
            if [ "$attempt" -eq 4 ]; then
              echo "::error::The production endpoint check failed after 4 attempts."
              exit 1
            fi

            case "$http_status" in
              4*) echo "::error::The production endpoint returned a non-retryable client error."; exit 1 ;;
            esac
            sleep "$((attempt * 5))"
          done

name: Render Backend Health Check

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: render-backend-health-check
  cancel-in-progress: false

jobs:
  health-check:
    name: Check Render liveness
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Request the liveness endpoint
        env:
          RENDER_HEALTH_URL: ${{ secrets.RENDER_HEALTH_URL }}
        run: |
          set -u

          if [ -z "${RENDER_HEALTH_URL:-}" ]; then
            echo "::error::Configure the RENDER_HEALTH_URL repository or environment secret."
            exit 2
          fi
          case "$RENDER_HEALTH_URL" in
            https://*/health) ;;
            *)
              echo "::error::RENDER_HEALTH_URL must be an HTTPS URL ending in /health."
              exit 2
              ;;
          esac

          for attempt in 1 2 3; do
            if http_status=$(curl --silent --output /dev/null --write-out '%{http_code}' \
              --connect-timeout 10 --max-time 90 "$RENDER_HEALTH_URL"); then
              curl_status=0
            else
              curl_status=$?
              http_status="${http_status:-000}"
            fi

            if [ "$curl_status" -eq 0 ] && [ "$http_status" = "200" ]; then
              echo "Liveness check succeeded (HTTP $http_status)."
              exit 0
            fi

            echo "Attempt $attempt failed (curl exit $curl_status, HTTP ${http_status:-000})."
            if [ "$attempt" -eq 3 ]; then
              echo "::error::Render liveness check failed after 3 attempts."
              exit 1
            fi

            case "$http_status" in
              4*) echo "::error::The liveness endpoint returned a non-retryable client error."; exit 1 ;;
            esac
            sleep "$((attempt * 2))"
          done

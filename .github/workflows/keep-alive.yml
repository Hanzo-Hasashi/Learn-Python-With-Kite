name: Render Backend Keep-Alive

on:
  schedule:
    # Run every 10 minutes to prevent Render Free tier inactivity sleep
    - cron: '*/10 * * * *'
  workflow_dispatch:

jobs:
  keep-alive:
    name: Ping Render Health
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Ping Live Health Endpoint
        run: |
          echo "Pinging Kite backend on Render..."
          HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" --retry 3 --retry-delay 5 --max-time 60 https://kite-backend-958r.onrender.com/health)
          echo "Health check HTTP response code: $HTTP_STATUS"
          if [ "$HTTP_STATUS" -ne 200 ]; then
            echo "::error::Render backend returned unexpected HTTP status $HTTP_STATUS"
            exit 1
          fi
          echo "Kite backend is active, healthy, and awake."

# Render Blueprint specification for Learn Python With Kite FastAPI Backend
# https://render.com/docs/blueprint-spec

services:
  - type: web
    name: kite-backend
    runtime: python
    plan: free
    region: frankfurt
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn backend.app:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    autoDeploy: false
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.8"
      - key: KITE_ENV
        value: production
      - key: PUBLIC_APP_URL
        value: https://learnpythonwithkite.vercel.app
      - key: KITE_CORS_ORIGINS
        value: https://learnpythonwithkite.vercel.app
      - key: KITE_COOKIE_SECURE
        value: "true"
      - key: KITE_COOKIE_SAMESITE
        value: lax
      - key: KITE_ALLOW_LOCAL_AUTH
        value: "false"
      - key: KITE_LENCO_COLLECTION_ENABLED
        value: "false"
      - key: KITE_LENCO_ZMW_COLLECTION_CONFIRMED
        value: "false"
      - key: KITE_PAWAPAY_ENABLED
        value: "false"
      - key: LOG_LEVEL
        value: INFO
      # Sensitive variables are marked sync: false so they are securely
      # entered in the Render Dashboard and never committed to Git.
      - key: DATABASE_URL
        sync: false
      - key: KITE_SECRET_KEY
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: PUBLIC_API_URL
        sync: false
      - key: KITE_VERCEL_PROXY
        sync: false
      - key: KITE_PROXY_SECRET
        sync: false
      - key: KITE_COOKIE_SITE
        sync: false
      - key: RUNNER_URL
        sync: false
      - key: RUNNER_SHARED_SECRET
        sync: false

  - type: web
    name: kite-playground
    runtime: docker
    dockerfilePath: ./runner/Dockerfile
    dockerContext: .
    plan: free
    region: frankfurt
    healthCheckPath: /health
    autoDeploy: false
    envVars:
      - key: RUNNER_SHARED_SECRET
        sync: false

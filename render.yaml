# Render Blueprint for the separate Kite Python Playground service only.

services:
  - type: web
    name: kite-playground
    runtime: docker
    dockerfilePath: ./runner/Dockerfile
    dockerContext: .
    plan: free
    region: frankfurt
    healthCheckPath: /health
    autoDeploy: false
    envVars:
      - key: RUNNER_SHARED_SECRET
        sync: false
